# Mediamtx config — RTSP cameras -> HLS for the rtsp.me app
# Docs: https://github.com/bluenviron/mediamtx
#
# AUTOMATIC MODE (recommended): in auto mode the streams service
# (streams/server.ts) adds and removes camera paths itself via the Mediamtx
# HTTP API — this file needs NO camera entries, hence `paths: {}` below.
#
# MANUAL MODE: uncomment a camera block below and restart Mediamtx.
# Each entry is one camera; Mediamtx pulls the RTSP source and serves HLS at:
#   http://<host>:8888/<path-name>/index.m3u8

logLevel: info

# HTTP API (the auto-HLS service talks to this; must match MEDIAMTX_URL)
api: yes
apiAddress: :9997

# HLS output (what the browser player consumes)
hls: yes
hlsAddress: :8888
# Re-encode to H.264/AAC if a camera sends an unsupported codec. Keep `no` for
# zero-CPU remuxing when cameras already output H.264 (recommended).
hlsAlwaysRemux: no

# For remote cameras, TCP transport is more reliable than UDP.
rtspTransports: [tcp]

paths: {}
# Manual-mode examples (auto mode manages paths dynamically):
#   cam1:  # Hikvision-style -> http://<host>:8888/cam1/index.m3u8
#     source: rtsp://user:pass@192.168.1.100:554/Streaming/Channels/101
#   cam2:  # Dahua-style -> http://<host>:8888/cam2/index.m3u8
#     source: rtsp://user:pass@192.168.1.101:554/cam/realmonitor?channel=1&subtype=0
